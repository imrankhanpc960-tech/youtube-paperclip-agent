name: Daily Paperclip YouTube Agent

on:
  schedule:
    # Daily UTC Time according schedule (09:00 AM UTC = 2:30 PM IST)
    - cron: '0 9 * * *'
  workflow_dispatch: # Manual Button enable karega

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Execute Paperclip Agent
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: |
        python agent_main.py
